name: iOS

on:
  push:
    branches: 'master'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        buildType: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir ~/build
          macBuild/buildiOS.sh ~/build ${{ matrix.buildType }}
      - name: Compress Artifacts
        run: |
          cd ~/build/avBuilt
          tar -zcvf ~/build.tar.gz *
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avBuiltiOS_${{ matrix.buildType }}.tar.gz
          path: ~/build.tar.gz
      - name: Publish to release
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release assets are publicly downloadable without auth and don't expire, unlike artifacts.
          TAG="deps-${GITHUB_SHA::7}"
          # Every platform workflow races to create the same release; the losers just upload.
          gh release create "$TAG" --target "$GITHUB_SHA" --title "avBuilt ${GITHUB_SHA::7}" \
            --notes "Prebuilt avEngine dependencies from $GITHUB_SHA." 2>/dev/null || true
          cp ~/build.tar.gz avBuiltiOS_${{ matrix.buildType }}.tar.gz
          gh release upload "$TAG" avBuiltiOS_${{ matrix.buildType }}.tar.gz --clobber
