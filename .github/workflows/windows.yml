name: windows

on:
  push:
    branches:  'master'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        buildType: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir D:\build
          windowsBuild\build.bat D:\build ${{ matrix.buildType }}
      - name: Compress Artifacts
        run: |
          Compress-Archive -Path D:\build\avBuilt\ -DestinationPath D:\build\avBuilt-windows-${{ matrix.buildType }}.zip
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avBuiltWindows-${{ matrix.buildType }}.zip
          path: D:\build\avBuilt-windows-${{ matrix.buildType }}.zip
      - name: Publish to release
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release assets are publicly downloadable without auth and don't expire, unlike artifacts.
          TAG="deps-${GITHUB_SHA::7}"
          # Every platform workflow races to create the same release; the losers just upload.
          gh release create "$TAG" --target "$GITHUB_SHA" --title "avBuilt ${GITHUB_SHA::7}" \
            --notes "Prebuilt avEngine dependencies from $GITHUB_SHA." 2>/dev/null || true
          cp D:/build/avBuilt-windows-${{ matrix.buildType }}.zip avBuiltWindows-${{ matrix.buildType }}.zip
          gh release upload "$TAG" avBuiltWindows-${{ matrix.buildType }}.zip --clobber
