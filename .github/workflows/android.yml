name: android

on:
  push:
    branches: ['master']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        buildType: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android NDK r25
        run: |
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r25-linux.zip
          unzip -q ndk.zip
          mv android-ndk-r25 ~/ndk

      - name: Build for Android
        run: |
          mkdir -p ~/buildAndroidRelease
          androidBuild/build.sh ~/buildAndroidRelease ~/ndk ${{ matrix.buildType }}

      - name: Compress Artifacts
        run: |
          cd ~/buildAndroidRelease/avBuilt
          tar -zcvf ~/android-avBuilt-${{ matrix.buildType }}.tar.gz *

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avBuiltAndroid-${{ matrix.buildType }}.tar.gz
          path: ~/android-avBuilt-${{ matrix.buildType }}.tar.gz
      - name: Publish to release
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release assets are publicly downloadable without auth and don't expire, unlike artifacts.
          TAG="deps-${GITHUB_SHA::7}"
          # Every platform workflow races to create the same release; the losers just upload.
          gh release create "$TAG" --target "$GITHUB_SHA" --title "avBuilt ${GITHUB_SHA::7}" \
            --notes "Prebuilt avEngine dependencies from $GITHUB_SHA." 2>/dev/null || true
          cp ~/android-avBuilt-${{ matrix.buildType }}.tar.gz avBuiltAndroid-${{ matrix.buildType }}.tar.gz
          gh release upload "$TAG" avBuiltAndroid-${{ matrix.buildType }}.tar.gz --clobber
